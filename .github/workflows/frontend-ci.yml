name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --workspace=frontend --include-workspace-root=false --no-audit --no-fund
      - run: npm run lint --workspace=frontend
      - run: npm test --workspace=frontend
      - run: npm run build --workspace=frontend
        env:
          NEXT_PUBLIC_API_URL: /api/v1
      - run: npm audit --workspace=frontend --audit-level=high --omit=dev

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f frontend/Dockerfile --build-arg NEXT_PUBLIC_API_URL=/api/v1 .
